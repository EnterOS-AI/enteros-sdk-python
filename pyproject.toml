[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule-ai-sdk"
version = "0.3.0"
description = "Molecule AI SDK — build plugins (molecule_plugin) AND remote agents that join a Molecule AI org from another machine (molecule_external_workspace)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Molecule AI" }]
keywords = ["agents", "ai", "multi-agent", "a2a", "plugins", "saas", "remote-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest-asyncio>=0.24"]
# SSOT contract bindings (molecule-contracts / RFC molecule-core#3285). Used
# only for type-checking the register/heartbeat/A2A payloads (TYPE_CHECKING
# import in molecule_external_workspace.client) — NOT a runtime requirement, so
# it is intentionally kept out of the base dependencies and the `test` extra to
# keep `pip install` CI green against plain PyPI. Install with the gitea index:
#   pip install "molecule-ai-sdk[contracts]" \
#     --extra-index-url https://git.moleculesai.app/api/packages/molecule-ai/pypi/simple/
contracts = ["molecule-ai-contracts>=0.1.0"]

[project.urls]
Homepage = "https://git.moleculesai.app/molecule-ai/molecule-sdk-python"
Repository = "https://git.moleculesai.app/molecule-ai/molecule-sdk-python"
Documentation = "https://git.moleculesai.app/molecule-ai/molecule-sdk-python#readme"

[tool.setuptools.packages.find]
include = ["molecule_plugin*", "molecule_external_workspace*"]
exclude = ["template*", "tests*"]

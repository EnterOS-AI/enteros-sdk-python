# Cloud-provider SSOT codegen-drift + conformance gate.
#
# Mirrors molecule-contracts/.gitea/workflows/codegen-drift.yml. The invariant:
# the committed generated bindings under gen/{go/cloudprovider,ts,python} are
# EXACTLY what tools/gen-*.mjs produce from contracts/cloudproviders.yaml —
# never hand-edited, never stale. Three independent guards over the one SSOT:
#
#   codegen-drift        (node-only) re-run the generators, fail on any diff in
#                        the GENERATED paths (scoped so the verbatim-moved
#                        llmwire/tools hand-authored files are never flagged).
#   contract-conformance (python)    jsonschema-validate the YAML + assert the
#                        semantic invariants (unique ids/aliases, one is_local,
#                        default resolves, {persist}∪{""}==migration-056 set).
#   go-parity            (go)        build + vet + the moved-verbatim
#                        cloudprovider_test.go behavior oracle + llmwire pins +
#                        nodup-lint's own tests + the SDK dependency guard.
#
# all three feed an all-required aggregator (mirrors the repo's ci.yml).

name: cloudproviders-codegen-drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cloudproviders-codegen-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen-drift:
    name: codegen-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate Go binding from the SSOT
        run: node tools/gen-go.mjs
      - name: Regenerate TypeScript catalog from the SSOT
        run: node tools/gen-ts.mjs
      - name: Regenerate Python constants from the SSOT
        run: node tools/gen-python.mjs
      - name: Fail if committed gen/ differs from a fresh regeneration
        shell: bash
        run: |
          set -euo pipefail
          # Scope to the GENERATED paths only. gen/go/{llmwire,tools,doc.go,
          # deps_test.go,go.mod,go.sum} + cloudprovider_test.go are moved-verbatim
          # hand-authored files, NOT regenerated, so they are intentionally out of
          # scope here (the go-parity job compiles/tests them instead).
          if ! git diff --exit-code -- gen/go/cloudprovider/cloudprovider.go gen/ts gen/python; then
            echo "::error::gen/ is out of date — committed generated bindings differ from a fresh"
            echo "::error::run of the generators. gen/ is NEVER hand-edited. Regenerate locally with"
            echo "::error::'node tools/gen-go.mjs && node tools/gen-ts.mjs && node tools/gen-python.mjs'"
            echo "::error::and commit the result."
            exit 1
          fi
          echo "gen/ is in sync with contracts/cloudproviders.yaml (no drift)"

  contract-conformance:
    name: contract-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install pytest "jsonschema>=4.18" "pyyaml>=6.0"
      - name: Validate SSOT schema + semantic invariants
        # --noconftest keeps this job hermetic: it needs only the contract test,
        # not the package's runtime deps (the repo's main `test` job exercises
        # the package + conftest fixtures separately).
        run: python -m pytest tests/test_cloudproviders_contract.py -q --noconftest

  go-parity:
    name: go-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gen/go/go.mod
          cache: false
      - name: go mod verify
        working-directory: gen/go
        run: go mod verify
      - name: build
        working-directory: gen/go
        run: go build ./...
      - name: vet
        working-directory: gen/go
        run: go vet ./...
      - name: test (parity oracle + llmwire + nodup-lint)
        working-directory: gen/go
        run: go test ./...
      - name: dependency guard (SDK depends on neither consumer)
        working-directory: gen/go
        run: go test -run TestNoConsumerDependency -v .

  all-required:
    name: all-required
    needs: [codegen-drift, contract-conformance, go-parity]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert every required dependency succeeded
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | python3 -c '
          import json, sys
          ns = json.load(sys.stdin)
          # Strict: every required dependency MUST be "success". A required
          # drift/conformance/parity gate that is skipped or cancelled must
          # RED this aggregator, not pass it (review #40: an all-required gate
          # can never treat non-success as acceptable, or the SSOT invariant
          # it guards is unenforced).
          bad = [(k, v.get("result")) for k, v in ns.items()
                 if v.get("result") != "success"]
          if bad:
              print("FAIL: jobs not green:", file=sys.stderr)
              for k, r in bad:
                  print(f"  - {k}: {r}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: all {len(ns)} required jobs succeeded")
          '
